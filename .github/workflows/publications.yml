# Refresh publications.json from ORCID, arXiv and Google Scholar every 6 hours,
# so new papers appear on the home page.
name: Update publications

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_publications.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- publications.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.json
          git commit -m "Update publications"
          git push
